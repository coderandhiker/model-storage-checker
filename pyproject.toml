[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-storage-checker"
version = "0.1.0"
description = "Inspect local model storage across supported providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "coderandhiker" }]
dependencies = []

[project.scripts]
model-storage-checker = "model_storage_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
